<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SeohoKim Apps</title>
  <meta name="description" content="SeohoKim Apps의 앱 '내 지갑 사정' 안내 페이지입니다.">
  <style>
    :root {
      --bg: #fcfcfb;
      --border: #ecebe7;
      --text: #1a1c1b;
      --text-secondary: #6b706e;
      --accent: #2f6f62;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Segoe UI", Roboto,
        sans-serif;
      font-size: 17px;
      line-height: 1.75;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    section {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      margin-top: 28px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
      line-height: 1.45;
      font-weight: 700;
    }

    p {
      margin: 0 0 10px;
    }

    ul {
      margin: 0;
      padding-left: 1.3em;
    }

    a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .muted {
      color: var(--text-secondary);
      font-size: 15px;
    }

    footer {
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 15px;
    }

    @media (max-width: 560px) {
      body {
        font-size: 16px;
      }

      .page {
        padding: 36px 18px 56px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">개발자</p>
      <h1>SeohoKim Apps</h1>
    </header>

    <section aria-labelledby="app-title">
      <h2 id="app-title">내 지갑 사정</h2>
      <p class="muted">직접 입력한 수입과 지출로 이번 달 여유자금을 확인하는 Android 가계부 앱</p>
      <ul>
        <li><a href="./privacy/">개인정보처리방침</a></li>
      </ul>
    </section>

    <footer>
      <p>문의: <a href="mailto:seohokim.apps@gmail.com">seohokim.apps@gmail.com</a></p>
    </footer>
  </main>
</body>
</html>
